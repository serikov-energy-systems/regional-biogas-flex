[project]
name = "biogasflex"
version = "0.1.0"
description = "Value of flexible biogas production in one Swedish region, regional self-sufficiency and resilience under policy and price uncertainty (research study, assumed parameters)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyomo", "highspy", "pyarrow", "joblib", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
